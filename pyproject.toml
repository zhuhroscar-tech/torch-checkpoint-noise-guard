[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-checkpoint-noise-guard"
version = "0.1.0"
description = "Detect and guard against F.rrelu silently wrong gradients under non-reentrant activation checkpointing or saved_tensors_hooks (pytorch/pytorch#193671)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-checkpoint-noise-guard = "torch_checkpoint_noise_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
